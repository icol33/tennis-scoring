<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rally Board by Cholid — Tennis Americano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EA; --surface:#FFFFFF; --surface2:#F5F7F2; --ink:#16241C; --muted:#5F6F66;
  --court:#1E5A43; --court-ink:#FFFFFF; --ball:#D9EE3A; --line:#D5DCD3;
  --win:#1E7A4C; --loss:#B8403A; --tie:#7A6A1E; --female:#A23B72;
  --shadow:0 1px 0 rgba(22,36,28,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1813; --surface:#17241C; --surface2:#1D2C23; --ink:#E9EFE8; --muted:#9DB0A4;
    --court:#2C7A5B; --court-ink:#FFFFFF; --ball:#D9EE3A; --line:#2A3B31;
    --win:#5BCB8C; --loss:#F07A72; --tie:#D9C45B; --female:#E58AB9;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1813; --surface:#17241C; --surface2:#1D2C23; --ink:#E9EFE8; --muted:#9DB0A4;
  --court:#2C7A5B; --court-ink:#FFFFFF; --ball:#D9EE3A; --line:#2A3B31;
  --win:#5BCB8C; --loss:#F07A72; --tie:#D9C45B; --female:#E58AB9;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.num{font-family:"Barlow Condensed","Arial Narrow",Archivo,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 40px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--court);color:var(--court-ink)}
.top-row{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:12px 12px 10px}
.top h1{flex:1;margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:transparent;border:0;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:inherit}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn svg{width:22px;height:22px}
.tabs{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:10px 4px 12px;color:rgba(255,255,255,.72);font-weight:600;font-size:15px;position:relative;display:flex;gap:6px;align-items:center;justify-content:center}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:4px;border-radius:4px 4px 0 0;background:var(--ball)}

/* brand mark: court lines */
.brand{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;border-radius:7px;background:var(--ball);position:relative;flex:none}
.mark::before{content:"";position:absolute;inset:6px 4px;border:2px solid var(--court);border-radius:2px}
.mark::after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:2px;margin-left:-1px;background:var(--court)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h2{margin:0 0 12px;font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--court);border-color:var(--court);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ball{background:var(--ball);border-color:var(--ball);color:#16241C}
.btn.danger{color:var(--loss)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

label.field{display:block;margin-bottom:12px}
label.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.input,select.input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:8px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--court);color:#fff}

/* players */
.player{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;background:var(--surface2);border-radius:10px;margin-bottom:6px}
.player input{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;font-size:16px;font-weight:500}
.player input:focus{outline:none;border-bottom:2px solid var(--court)}
.gender{width:34px;height:30px;border-radius:15px;border:0;font-weight:700;font-size:13px}
.gender.M{background:rgba(30,90,67,.14);color:var(--court)}
.gender.F{background:rgba(162,59,114,.14);color:var(--female)}
.del{width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.del:hover{color:var(--loss);background:rgba(184,64,58,.08)}
.del svg{width:18px;height:18px}

/* status chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;background:var(--surface2);border:1px solid var(--line)}
.chip.on{background:var(--court);color:#fff;border-color:var(--court)}

/* round nav */
.roundnav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.roundnav .btn{width:52px;height:44px;padding:0;display:grid;place-items:center}
.roundnav .btn svg{width:20px;height:20px}
.roundtitle{text-align:center}
.roundtitle b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:30px;font-weight:800;letter-spacing:.01em;display:block;line-height:1}
.dots{display:flex;gap:4px;justify-content:center;margin-top:6px;flex-wrap:wrap;max-width:220px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--court)}
.dot.cur{outline:2px solid var(--ball);outline-offset:1px}

/* match card: drawn like a court */
.match{margin-top:14px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.match-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--court);color:#fff;font-weight:600;font-size:14px}
.match-head .tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.16)}
.match-head .tag.done{background:var(--ball);color:#16241C}
.match-head .tag.live{background:#fff;color:var(--court)}
.court{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:0;padding:14px}
.side{border-radius:10px;padding:10px 12px;background:var(--surface2);display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:64px;font-weight:600}
.side.win{background:rgba(30,122,76,.12);box-shadow:inset 0 0 0 2px var(--win)}
.side .lbl{font-size:12px;color:var(--muted);font-weight:500}
.net{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;min-width:92px}
.score{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:40px;font-weight:800;line-height:1;letter-spacing:.02em}
.score.empty{color:var(--muted);font-size:26px}
.net .vs{font-size:12px;color:var(--muted);margin-bottom:4px}
.match-actions{display:flex;gap:8px;padding:0 14px 14px}
.match-actions .btn{flex:1;padding:9px 8px;font-size:14px}

.score-edit{display:flex;align-items:center;gap:6px}
.score-edit input{width:52px;text-align:center;font-size:26px;font-weight:800;padding:6px 2px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.slot-select{width:100%;margin-top:4px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:15px}

.bench{margin-top:14px;border-radius:14px;border:1px dashed var(--line);padding:12px 14px}
.bench h3{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--muted)}
.bench .names{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:6px 12px;border-radius:8px;background:var(--surface2);font-weight:500;font-size:14px}

/* ranking */
.leader{margin-top:14px;border-radius:16px;background:var(--court);color:#fff;padding:22px 18px 20px;position:relative;overflow:hidden}
.leader::before{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.22);border-radius:6px;pointer-events:none}
.leader::after{content:"";position:absolute;left:50%;top:14px;bottom:14px;width:2px;background:rgba(255,255,255,.22)}
.leader .ballshape{position:absolute;right:26px;top:22px;width:44px;height:44px;border-radius:50%;background:var(--ball);z-index:1}
.leader .ballshape::before,.leader .ballshape::after{content:"";position:absolute;width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.85)}
.leader .ballshape::before{left:-30px;top:0}
.leader .ballshape::after{right:-30px;top:0}
.leader .ballshape{overflow:hidden}
.leader small{position:relative;z-index:1;display:block;font-size:14px;opacity:.85}
.leader strong{position:relative;z-index:1;display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:52px;font-weight:800;line-height:1;margin-top:6px;letter-spacing:.01em;max-width:80%;overflow-wrap:anywhere}
.leader .meta{position:relative;z-index:1;margin-top:8px;font-size:14px;opacity:.9}
.table-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:360px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(1),th:nth-child(2){text-align:left}
td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td:nth-child(1){text-align:left;width:34px;font-weight:700}
td:nth-child(2){text-align:left}
tr:last-child td{border-bottom:0}
tr.first td{background:rgba(217,238,58,.18)}
.pname{background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.pos{color:var(--win)} .neg{color:var(--loss)}
.pts{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px;font-weight:800}
.legend{margin-top:10px;font-size:13px;color:var(--muted)}

/* home */
.hero{padding:22px 0 6px}
.hero h2{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:40px;font-weight:800;line-height:1;letter-spacing:.005em}
.hero p{margin:8px 0 0;color:var(--muted)}
.session{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.session:hover{border-color:var(--court)}
.session .d{width:52px;flex:none;text-align:center;border-radius:10px;background:var(--surface2);padding:6px 0}
.session .d b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;line-height:1}
.session .d span{font-size:12px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.badge.live{background:rgba(30,122,76,.14);color:var(--win)}

.notice{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(217,238,58,.22);border:1px solid rgba(160,176,30,.5);font-size:14px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,14,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.modal h3{margin:0 0 4px;font-size:20px}
.hist{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border-bottom:0}
.res{font-weight:700;min-width:22px;text-align:center;border-radius:6px;padding:1px 6px}
.res.W{background:rgba(30,122,76,.14);color:var(--win)} .res.L{background:rgba(184,64,58,.12);color:var(--loss)} .res.T{background:rgba(122,106,30,.14);color:var(--tie)}
textarea.input{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}

/* balanced-round marker */
.dot.bal{background:transparent;box-shadow:inset 0 0 0 2px var(--court)}
.dot.bal.done{background:var(--court);box-shadow:0 0 0 2px var(--ball)}
.balnote{margin-top:8px;font-size:12px;color:var(--muted);max-width:240px}
.balnote.ok{color:var(--win);font-weight:600}
.virt{font-size:12px;font-weight:700;color:var(--tie);white-space:nowrap}
.notes{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted)}
.notes summary{cursor:pointer;font-weight:600;color:var(--ink)}
.notes ul{margin:8px 0 0;padding-left:18px}
.notes li{margin:4px 0}

/* player analytics page */
.pa{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.pa-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:var(--court);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 12px}
.pa-title{flex:1;text-align:center;min-width:0}
.pa-title h3{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:28px;font-weight:800;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pa-title small{opacity:.85;font-size:14px}
.pa-body{max-width:680px;margin:0 auto;padding:14px 16px calc(30px + env(safe-area-inset-bottom,0px))}
.pa-caption{display:none;font-weight:700;margin-bottom:10px}
.pa-body.capturing .pa-caption{display:block}
.pa-top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pa-top div,.pa-card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pa-top div{padding:14px 8px;text-align:center}
.pa-top b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:34px;font-weight:800;line-height:1.05}
.pa-top span,.pa-5 span,.pa-2 span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.pa-card{padding:16px;margin-top:14px}
.pa-card h4{margin:0 0 12px;font-size:17px}
.pa-5{display:grid;grid-template-columns:repeat(5,1fr);text-align:center}
.pa-5 b,.pa-2 b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:32px;font-weight:800;line-height:1.05}
.pa-ss{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;text-align:center}
.pa-ss-h{font-size:15px;font-weight:600}
.pa-2{display:grid;grid-template-columns:1fr 1fr}
.pa-item{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:8px}
.pa-item b{display:block;font-size:17px;font-weight:600}
.pa-item span{font-size:14px;color:var(--muted)}
.pa-item em{font-style:normal;font-weight:600}
.pa b.muted{color:var(--muted)}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.newg{flex:none;width:92px}
.addround{margin-top:16px;border-style:dashed;border-width:2px;border-color:var(--court);color:var(--court);background:transparent;padding:13px}
.hosted{color:var(--court);margin-top:2px}
.hosted b{font-weight:700}
/* dashboard cards (PlayByTurn style) */
.sec-title{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;font-weight:800}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.tcard-top{display:flex;align-items:flex-start;gap:10px}
.tcard-top h3{flex:1;margin:0;font-size:18px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.tdate{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);white-space:nowrap;padding-top:2px}
.tdate svg{width:15px;height:15px}
.tmeta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:14px;color:var(--court);font-weight:500;align-items:center}
.tcard .hosted{margin-top:6px}
.tactions{display:flex;align-items:center;gap:4px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tact{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.tact:hover{background:var(--surface2);color:var(--ink)}
.tact.danger:hover{color:var(--loss);background:rgba(184,64,58,.08)}
.tact svg{width:20px;height:20px}
.btn.enter{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:8px 14px}
.btn.enter svg{width:16px;height:16px}
/* past players picker */
.past{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.pastlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pastchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px 6px 6px;font-size:14px;font-weight:500}
.pastchip:hover{border-color:var(--court)}
.pastchip .g{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.pastchip .g.M{background:rgba(30,90,67,.14);color:var(--court)}
.pastchip .g.F{background:rgba(162,59,114,.14);color:var(--female)}
.linkbtn{border:0;background:none;color:var(--court);font-weight:600;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
/* tournament matches history */
.hist-card{margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.hist-card h3{margin:0;padding:14px 16px;background:var(--court);color:#fff;font-size:18px}
.hist-filter{display:flex;justify-content:center;gap:8px;padding:12px}
.hrow{padding:12px 16px;border-top:1px solid var(--line)}
.hrow-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hbadge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.hbadge.done{background:rgba(30,122,76,.14);color:var(--win)}
.hbadge.live{background:rgba(217,238,58,.3);color:var(--ink)}
.hrow-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:6px;font-size:15px}
.ht.a{text-align:right}
.ht.w{font-weight:700;color:var(--win)}
.hs{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:800;min-width:56px;text-align:center}
.sharebtn{display:flex;align-items:center;justify-content:center;gap:8px}
.sharebtn svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.85}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ball)}
.sync.local i{background:#fff;opacity:.6}
@media (prefers-reduced-motion: no-preference){.match,.leader{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
